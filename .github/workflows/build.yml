# Build: every push to main and every pull request builds the three projects with warnings as errors and runs the offline
# tests (a fake Mod Organizer folder - no MO2, no game). Docs-only changes skip it.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      # each action by the commit of its release, so a moved tag cannot change what runs here (Dependabot keeps them current)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build "src/Tool Runner.slnx" -c Release -nologo
      - name: Offline tests
        run: dotnet run --project src/Runner.Tests -c Release --no-build
      - name: Single-file exe
        shell: pwsh
        run: |
          dotnet publish src/Runner.App -c Release -nologo -o publish
          $exe = Get-Item "publish/Tool Runner.exe"
          "### Tool Runner.exe: $([math]::Round($exe.Length / 1KB)) KB" >> $env:GITHUB_STEP_SUMMARY
